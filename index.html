<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도형의 뒤집기와 돌리기 완전 정복!</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f5f7fa; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* 공통 카드 레이아웃 */
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); width: 100%; max-width: 800px; text-align: center; box-sizing: border-box; position: relative; }
        .main-title { color: #2e7d32; font-size: 32px; font-weight: bold; margin-bottom: 30px; letter-spacing: -1px; }
        .section-title { font-size: 22px; color: #333; margin-bottom: 25px; font-weight: bold; }
        
        /* 📱 QR 코드 버튼 스타일 (첫 화면 오른쪽 상단 고정) */
        .qr-btn-wrapper { position: absolute; top: 20px; right: 25px; z-index: 100; }
        .qr-show-btn { padding: 8px 15px; background-color: #fff; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; font-weight: bold; color: #666; cursor: pointer; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        .qr-show-btn:hover { background-color: #f9f9f9; border-color: #999; }

        /* 🖼️ QR 코드 모달(팝업) 스타일 */
        #qr-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 5px 30px rgba(0,0,0,0.3); }
        .modal-content h3 { margin-top: 0; color: #333; }
        .modal-content img { width: 250px; height: 250px; margin: 15px 0; border: 1px solid #eee; }
        .modal-content p { font-size: 14px; color: #2196F3; font-weight: bold; word-break: break-all; }
        .modal-close-btn { margin-top: 15px; padding: 10px 25px; background: #555; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; -webkit-tap-highlight-color: transparent; }

        /* [화면 1] 문제 유형 및 설정 화면 UI */
        .setup-grid { display: flex; gap: 20px; justify-content: center; align-items: stretch; margin-bottom: 20px; }
        .setup-panel { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 25px; box-sizing: border-box; }
        .panel-label { font-size: 16px; font-weight: bold; color: #555; margin-bottom: 20px; }
        
        .type-panel { flex: 2; }
        .type-btn-group { display: flex; gap: 10px; justify-content: center; }
        .opt-btn { padding: 15px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; background-color: #f0f0f0; color: #666; -webkit-tap-highlight-color: transparent; }
        .opt-btn.active { background-color: #ffb300; color: white; box-shadow: 0 4px 10px rgba(255,179,0,0.3); }
        
        .count-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .counter-wrapper { display: flex; align-items: center; gap: 15px; margin-top: 5px; }
        .count-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #ccc; background: #fff; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; -webkit-tap-highlight-color: transparent; }
        .count-display { font-size: 24px; font-weight: bold; color: #333; min-width: 30px; user-select: none; }
        
        .start-btn-container { display: flex; justify-content: flex-end; padding-right: 20px; margin-top: 10px; }
        .start-circle-btn { width: 85px; height: 85px; background-color: #81c784; color: white; border: none; border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 15px rgba(129,199,132,0.4); -webkit-tap-highlight-color: transparent; }
        .start-circle-btn:hover { background-color: #66bb6a; transform: scale(1.05); }

        /* [화면 2] 실습 그리기 화면 UI */
        .header-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .back-btn { padding: 8px 16px; background-color: #f0f0f0; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; color: #555; -webkit-tap-highlight-color: transparent; }
        .remain-count { font-size: 16px; font-weight: bold; color: #757575; }
        
        .game-info { font-size: 16px; color: #666; margin-bottom: 25px; }
        .canvas-flex { display: flex; gap: 30px; align-items: center; justify-content: center; margin-top: 10px; }
        .canvas-box { text-align: center; }
        .canvas-label { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #555; }
        canvas { border: 2px solid #444; background-color: #fff; cursor: crosshair; border-radius: 4px; touch-action: none; }
        .arrow { font-size: 40px; color: #ff5722; user-select: none; }

        .step-container { display: flex; gap: 12px; justify-content: center; margin-top: 25px; }
        .step-btn { padding: 12px 28px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.15s; -webkit-tap-highlight-color: transparent; }
        .btn-inactive { background-color: #e0e0e0; color: #616161; }
        .btn-active-vertex { background-color: #ffb300; color: white; } 
        .btn-active-line { background-color: #4caf50; color: white; }   
        .btn-clear { background-color: #e57373; color: white; }        

        .check-btn { margin-top: 25px; padding: 14px 60px; font-size: 18px; font-weight: bold; background-color: #2e7d32; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(46,125,50,0.2); -webkit-tap-highlight-color: transparent; }
        .check-btn:hover { background-color: #1b5e20; }
        
        .copyright { font-size: 12px; color: #b0bec5; margin-top: 30px; user-select: none; }
    </style>
</head>
<body>

    <div id="qr-modal" onclick="toggleQR(false)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>QR 코드로 접속하기</h3>
            <img id="qr-image" src="" alt="QR Code">
            <p>https://2godzero.github.io/mathgame/</p>
            <button class="modal-close-btn" onclick="toggleQR(false)">닫기</button>
        </div>
    </div>

    <div id="screen-main" class="card">
        <div class="qr-btn-wrapper">
            <button class="qr-show-btn" onclick="toggleQR(true)">QR 코드</button>
        </div>
        <div class="main-title">도형의 뒤집기와 돌리기 완전 정복!</div>
        <div class="section-title">문제 유형 및 설정</div>
        
        <div class="setup-grid">
            <div class="setup-panel type-panel">
                <div class="panel-label">문제 유형 선택</div>
                <div class="type-btn-group">
                    <button id="type-flip" class="opt-btn active" onclick="selectType('flip')">뒤집기형</button>
                    <button id="type-turn" class="opt-btn" onclick="selectType('turn')">돌리기형</button>
                    <button id="type-both" class="opt-btn" onclick="selectType('both')">둘 다 할래요</button>
                </div>
            </div>
            
            <div class="setup-panel count-panel">
                <div class="panel-label">문제 개수 설정</div>
                <div class="counter-wrapper">
                    <button class="count-btn" onclick="adjustCount(-1)">-</button>
                    <div id="count-txt" class="count-display">5</div>
                    <button class="count-btn" onclick="adjustCount(1)">+</button>
                </div>
            </div>
        </div>
        
        <div class="start-btn-container">
            <button class="start-circle-btn" onclick="startQuizSession()">시작!</button>
        </div>
        
        <div class="copyright">Copyright © 2026 신덕여왕. All rights reserved.</div>
    </div>

    <div id="screen-practice" class="card" style="display: none;">
        <div class="header-meta">
            <button class="back-btn" onclick="goBackToMenu()">🏠 모드 선택으로</button>
            <div id="remain-txt" class="remain-count">남은 문제 0개</div>
        </div>
        
        <div id="practice-title" class="main-title" style="font-size: 26px; margin-bottom: 5px; color:#333;">1번째 문제</div>
        <div id="practice-info" class="game-info">도형을 알맞게 격자 위에 변형하여 완성해 보세요.</div>
        
        <div class="canvas-flex">
            <div class="canvas-box">
                <div class="canvas-label">문제 도형</div>
                <canvas id="questionCanvas" width="240" height="240"></canvas>
            </div>
            <div class="arrow">➡️</div>
            <div class="canvas-box">
                <div class="canvas-label">정답 그리기</div>
                <canvas id="answerCanvas" width="240" height="240"></canvas>
            </div>
        </div>

        <div class="step-container">
            <button id="btn-step-vertex" class="step-btn btn-active-vertex" onclick="setStep('vertex')">1단계: 꼭짓점</button>
            <button id="btn-step-line" class="step-btn btn-inactive" onclick="setStep('line')">2단계: 선분</button>
            <button class="step-btn btn-clear" onclick="clearAllAnswer()">모두 지우기</button>
        </div>

        <button class="check-btn" onclick="checkAnswer()">정답 확인하기</button>
        <div class="copyright">Copyright © 2026 신덕여왕. All rights reserved.</div>
    </div>

    <script>
        const qCanvas = document.getElementById('questionCanvas');
        const qCtx = qCanvas.getContext('2d');
        const aCanvas = document.getElementById('answerCanvas');
        const aCtx = aCanvas.getContext('2d');

        const gridSize = 40;
        const gridCount = 6;
        const width = qCanvas.width;
        const height = qCanvas.height;

        let configType = 'flip';  
        let configCount = 5;      
        
        let sessionQuestions = []; 
        let activeIndex = 0;       
        let currentStep = 'vertex';
        
        let userPoints = [];       
        let userLines = [];        
        let selectedPoint = null;  

        const rawPool = {
            flip: [
                { title: "문제 (오른쪽으로 뒤집기)", type: "flip_h", points: [{x: 1, y: 1}, {x: 4, y: 1}, {x: 4, y: 5}, {x: 2, y: 5}] },
                { title: "문제 (왼쪽으로 뒤집기)", type: "flip_h", points: [{x: 2, y: 1}, {x: 4, y: 1}, {x: 5, y: 4}, {x: 1, y: 4}] },
                { title: "문제 (아래쪽으로 뒤집기)", type: "flip_v", points: [{x: 1, y: 1}, {x: 5, y: 1}, {x: 5, y: 3}, {x: 3, y: 3}, {x: 3, y: 5}, {x: 1, y: 5}] },
                { title: "문제 (위쪽으로 뒤집기)", type: "flip_v", points: [{x: 1, y: 5}, {x: 5, y: 5}, {x: 4, y: 2}, {x: 2, y: 2}] },
                { title: "문제 (오른쪽으로 뒤집기)", type: "flip_h", points: [{x: 2, y: 2}, {x: 5, y: 2}, {x: 3, y: 5}] }
            ],
            turn: [
                { title: "문제 (시계방향으로 90° 돌리기)", type: "turn_90_cw", points: [{x: 1, y: 1}, {x: 5, y: 1}, {x: 3, y: 4}] },
                { title: "문제 (시계방향으로 180° 돌리기)", type: "turn_180", points: [{x: 2, y: 1}, {x: 5, y: 1}, {x: 5, y: 5}, {x: 2, y: 5}] },
                { title: "문제 (반시계방향으로 90° 돌리기)", type: "turn_90_ccw", points: [{x: 1, y: 2}, {x: 5, y: 2}, {x: 5, y: 5}] },
                { title: "문제 (시계방향으로 90° 돌리기)", type: "turn_90_cw", points: [{x: 2, y: 2}, {x: 4, y: 1}, {x: 5, y: 5}] },
                { title: "문제 (반시계방향으로 180° 돌리기)", type: "turn_180", points: [{x: 1, y: 1}, {x: 4, y: 1}, {x: 4, y: 4}, {x: 1, y: 4}] }
            ]
        };

        function toggleQR(show) {
            const modal = document.getElementById('qr-modal');
            const qrImg = document.getElementById('qr-image');
            const targetUrl = "https://2godzero.github.io/mathgame/";

            if (show) {
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(targetUrl)}`;
                modal.style.display = 'flex';
            } else {
                modal.style.display = 'none';
            }
        }

        function selectType(type) {
            configType = type;
            document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('active'));
            if(type === 'flip') document.getElementById('type-flip').classList.add('active');
            if(type === 'turn') document.getElementById('type-turn').classList.add('active');
            if(type === 'both') document.getElementById('type-both').classList.add('active');
        }

        function adjustCount(val) {
            configCount += val;
            if (configCount < 5) configCount = 5;
            if (configCount > 10) configCount = 10;
            document.getElementById('count-txt').innerText = configCount;
        }

        function startQuizSession() {
            let pool = [];
            if (configType === 'flip') pool = [...rawPool.flip];
            else if (configType === 'turn') pool = [...rawPool.turn];
            else pool = [...rawPool.flip, ...rawPool.turn];

            pool.sort(() => Math.random() - 0.5);
            sessionQuestions = pool.slice(0, configCount);
            activeIndex = 0;

            document.getElementById('screen-main').style.display = 'none';
            document.getElementById('screen-practice').style.display = 'block';
            loadSessionQuestion();
        }

        function loadSessionQuestion() {
            userPoints = []; userLines = []; selectedPoint = null;
            setStep('vertex');
            if(sessionQuestions.length === 0) return;
            const q = sessionQuestions[activeIndex];
            document.getElementById('practice-title').innerText = `${activeIndex + 1}번째 문제`;
            document.getElementById('practice-info').innerText = q.title + "를 한 후의 모양을 그려보세요.";
            document.getElementById('remain-txt').innerText = `남은 문제 ${sessionQuestions.length - activeIndex}개`;
            qCtx.clearRect(0, 0, width, height);
            drawGrid(qCtx);
            drawShape(qCtx, q.points, '#4b4b4b');
            renderAnswerCanvas();
        }

        function goBackToMenu() {
            document.getElementById('screen-practice').style.display = 'none';
            document.getElementById('screen-main').style.display = 'block';
        }

        function setStep(step) {
            currentStep = step;
            if (step === 'vertex') selectedPoint = null;
            const btnVertex = document.getElementById('btn-step-vertex');
            const btnLine = document.getElementById('btn-step-line');
            if(step === 'vertex') {
                btnVertex.className = "step-btn btn-active-vertex";
                btnLine.className = "step-btn btn-inactive";
            } else {
                btnVertex.className = "step-btn btn-inactive";
                btnLine.className = "step-btn btn-active-line";
            }
            renderAnswerCanvas();
        }

        function drawGrid(ctx) {
            ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 1;
            for (let i = 0; i <= gridCount; i++) {
                let pos = i * gridSize;
                ctx.beginPath(); ctx.moveTo(pos, 0); ctx.lineTo(pos, height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(width, pos); ctx.stroke();
            }
        }

        function drawShape(ctx, points, color) {
            if (ctx === qCtx) {
                if (points.length === 0) return;
                ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.fillStyle = color + '15';
                ctx.beginPath();
                ctx.moveTo(points[0].x * gridSize, points[0].y * gridSize);
                for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x * gridSize, points[i].y * gridSize);
                ctx.closePath(); ctx.fill(); ctx.stroke();
                points.forEach(p => {
                    ctx.beginPath(); ctx.arc(p.x * gridSize, p.y * gridSize, 5, 0, Math.PI * 2);
                    ctx.fillStyle = color; ctx.fill();
                });
            } else {
                ctx.strokeStyle = color; ctx.lineWidth = 3;
                userLines.forEach(line => {
                    ctx.beginPath(); ctx.moveTo(line.p1.x * gridSize, line.p1.y * gridSize);
                    ctx.lineTo(line.p2.x * gridSize, line.p2.y * gridSize); ctx.stroke();
                });
                userPoints.forEach(p => {
                    ctx.beginPath(); ctx.arc(p.x * gridSize, p.y * gridSize, 5, 0, Math.PI * 2);
                    ctx.fillStyle = color; ctx.fill();
                });
                if (currentStep === 'line' && selectedPoint !== null) {
                    ctx.beginPath(); ctx.arc(selectedPoint.x * gridSize, selectedPoint.y * gridSize, 9, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ff5722'; ctx.lineWidth = 2; ctx.stroke();
                }
            }
        }

        function renderAnswerCanvas() {
            aCtx.clearRect(0, 0, width, height);
            drawGrid(aCtx); drawShape(aCtx, userPoints, '#2196F3');
        }

        function clearAllAnswer() { userPoints = []; userLines = []; selectedPoint = null; setStep('vertex'); }

        function handleCanvasClick(clientX, clientY) {
            const rect = aCanvas.getBoundingClientRect();
            const gridX = Math.round((clientX - rect.left) / gridSize);
            const gridY = Math.round((clientY - rect.top) / gridSize);
            if (gridX < 0 || gridX > gridCount || gridY < 0 || gridY > gridCount) return;

            if (currentStep === 'vertex') {
                const idx = userPoints.findIndex(p => p.x === gridX && p.y === gridY);
                if (idx === -1) userPoints.push({ x: gridX, y: gridY });
                else {
                    userPoints.splice(idx, 1);
                    userLines = userLines.filter(l => !(l.p1.x === gridX && l.p1.y === gridY) && !(l.p2.x === gridX && l.p2.y === gridY));
                }
            } else if (currentStep === 'line') {
                if (selectedPoint === null) {
                    selectedPoint = { x: gridX, y: gridY };
                    if (!userPoints.some(p => p.x === gridX && p.y === gridY)) userPoints.push({ x: gridX, y: gridY });
                } else {
                    if (selectedPoint.x === gridX && selectedPoint.y === gridY) selectedPoint = null;
                    else {
                        userLines.push({ p1: { x: selectedPoint.x, y: selectedPoint.y }, p2: { x: gridX, y: gridY } });
                        if (!userPoints.some(p => p.x === gridX && p.y === gridY)) userPoints.push({ x: gridX, y: gridY });
                        selectedPoint = { x: gridX, y: gridY };
                    }
                }
            }
            renderAnswerCanvas();
        }

        aCanvas.addEventListener('mousedown', function(e) {
            handleCanvasClick(e.clientX, e.clientY);
        });

        aCanvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if(e.touches.length > 0) {
                handleCanvasClick(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        function standardizeSegment(p1, p2) {
            if (p1.x < p2.x || (p1.x === p2.x && p1.y < p2.y)) return { p1, p2 };
            else return { p1: p2, p2: p1 };
        }

        function getTransformedPoints(points, type) {
            return points.map(p => {
                if (type === "flip_h") return { x: -p.x, y: p.y };
                if (type === "flip_v") return { x: p.x, y: -p.y };
                if (type === "turn_90_cw") return { x: -p.y, y: p.x };
                if (type === "turn_180") return { x: -p.x, y: -p.y };
                if (type === "turn_90_ccw") return { x: p.y, y: -p.x };
                return p;
            });
        }

        function checkAnswer() {
            const q = sessionQuestions[activeIndex];
            const correctTransformed = getTransformedPoints(q.points, q.type);
            let correctSegments = [];
            for (let i = 0; i < correctTransformed.length; i++) {
                correctSegments.push(standardizeSegment(correctTransformed[i], correctTransformed[(i + 1) % correctTransformed.length]));
            }
            let userSegments = [];
            userLines.forEach(l => userSegments.push(standardizeSegment(l.p1, l.p2)));
            let uniqueUserSegments = [];
            userSegments.forEach(s => {
                if (!uniqueUserSegments.some(u => u.p1.x === s.p1.x && u.p1.y === s.p1.y && u.p2.x === s.p2.x && u.p2.y === s.p2.y)) uniqueUserSegments.push(s);
            });

            if (uniqueUserSegments.length !== correctSegments.length) { alert("다시 풀어보세요. ❌"); return; }

            let allCP = []; correctSegments.forEach(s => { allCP.push(s.p1); allCP.push(s.p2); });
            const minCX = Math.min(...allCP.map(p => p.x)), minCY = Math.min(...allCP.map(p => p.y));
            let normCS = correctSegments.map(s => ({ p1: { x: s.p1.x - minCX, y: s.p1.y - minCY }, p2: { x: s.p2.x - minCX, y: s.p2.y - minCY } }));

            let allUP = []; uniqueUserSegments.forEach(s => { allUP.push(s.p1); allUP.push(s.p2); });
            if (allUP.length === 0) { alert("다시 풀어보세요. ❌"); return; }
            const minUX = Math.min(...allUP.map(p => p.x)), minUY = Math.min(...allUP.map(p => p.y));
            let normUS = uniqueUserSegments.map(s => ({ p1: { x: s.p1.x - minUX, y: s.p1.y - minUY }, p2: { x: s.p2.x - minUX, y: s.p2.y - minUY } }));

            let matchCount = 0;
            normCS.forEach(nc => { if (normUS.some(nu => nu.p1.x === nc.p1.x && nu.p1.y === nc.p1.y && nu.p2.x === nc.p2.x && nu.p2.y === nc.p2.y)) matchCount++; });

            if (matchCount === normCS.length) {
                alert("정답! 🎉");
                activeIndex++;
                if (activeIndex < sessionQuestions.length) loadSessionQuestion();
                else { alert("축하합니다! 모든 문제를 완료했습니다! 🏆"); goBackToMenu(); }
            } else { alert("다시 풀어보세요. ❌"); }
        }
    </script>
</body>
</html>
